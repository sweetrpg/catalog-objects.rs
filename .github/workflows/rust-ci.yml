name: CI

concurrency: ci-${{ github.ref }}

on:
    push:
        branches: [develop]
        paths:
            - "src/**/*.rs"
            - Cargo.toml
            - .rust-version
            - ".github/workflows/**"
    workflow_dispatch:

jobs:
    tests:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux
                      os: ubuntu-latest
                      target: x86_64-unknown-linux-musl
                    # - build: macos
                    #   os: macos-latest
                    #   target: x86_64-apple-darwin

        steps:
          - uses: actions/checkout@v4
          - name: Get language version
            id: get_lang_version
            run: |
                  v=$(cat .rust-version)
                  echo "lang_version=$v" >> $GITHUB_OUTPUT
          - name: Install Rust
            # Or @nightly if you want
            uses: dtolnay/rust-toolchain@stable
            # Arguments to pass in
            with:
              # Make Rust compile to our target (defined in the matrix)
              targets: ${{ matrix.target }}
              # rust-version: ${{ steps.get_lang_version.outputs.lang_version }}
          - name: Build
            uses: actions-rs/cargo@v1
            with:
              use-cross: true
              command: build
              args: --verbose --release --target ${{ matrix.target }}
          # Native host toolchain, not the musl cross target above - tarpaulin
          # instruments locally and doesn't need the release cross-build.
          - name: Test
            run: cargo test --verbose
          - name: Install cargo-tarpaulin
            id: install_tarpaulin
            uses: taiki-e/install-action@v2
            with:
              tool: cargo-tarpaulin
          - name: Coverage (tarpaulin)
            id: coverage
            run: |
              mkdir -p coverage
              cargo tarpaulin --engine llvm --out Html --out Xml --output-dir coverage | tee coverage/tarpaulin-output.txt
          - name: Coverage summary
            run: |
              echo "## Rust coverage" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat coverage/tarpaulin-output.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
          - name: Upload coverage artifact
            uses: actions/upload-artifact@v4
            with:
              name: coverage-report-${{ matrix.name }}
              path: coverage/
          # Warn-only: continue-on-error means this never blocks the job, only shows
          # as a flagged step.
          - name: Coverage threshold
            continue-on-error: true
            run: |
              LINE_RATE=$(grep -oE '<coverage [^>]*line-rate="[0-9.]+"' coverage/cobertura.xml \
                | grep -oE 'line-rate="[0-9.]+"' | grep -oE '[0-9.]+')
              PCT=$(awk -v r="$LINE_RATE" 'BEGIN { printf "%.2f", r*100 }')
              echo "Coverage: ${PCT}%"
              awk -v pct="$PCT" 'BEGIN { exit !(pct+0 >= 0) }'
          # Written into coverage/ so the publish step below carries it to GitHub Pages
          # alongside the HTML report - avoids committing to the source branch.
          - name: Coverage badge
            continue-on-error: true
            run: |
              LINE_RATE=$(grep -oE '<coverage [^>]*line-rate="[0-9.]+"' coverage/cobertura.xml \
                | grep -oE 'line-rate="[0-9.]+"' | grep -oE '[0-9.]+')
              PCT=$(awk -v r="$LINE_RATE" 'BEGIN { printf "%.2f", r*100 }')
              COLOR=$(awk -v p="$PCT" 'BEGIN { if (p>=80) print "brightgreen"; else if (p>=50) print "yellow"; else print "red" }')
              printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
                "$PCT" "$COLOR" > coverage/coverage-badge.json
          - name: Publish coverage
            uses: peaceiris/actions-gh-pages@v4
            with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                publish_dir: ./coverage

    #    docs:
    #        needs: [tests]
    #        runs-on: ubuntu-latest
    #        concurrency: docs
    #        steps:
    #            - uses: actions/checkout@v4
    #            - uses: actions/setup-python@v5
    #              with:
    #                  python-version: "3.11"
    #            - name: install-deps
    #              run: pip install -r requirements/docs.txt
    #            - name: make-docs
    #              run: cd docs && make html
    #            - name: publish-docs
    #              uses: peaceiris/actions-gh-pages@v4
    #              with:
    #                  github_token: ${{ secrets.GITHUB_TOKEN }}
    #                  publish_dir: ./docs/_build/html

    tag:
        needs: [tests]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Bump version and push tag
              uses: anothrNick/github-tag-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  WITH_V: true
                  DEFAULT_BUMP: patch

    publish:
        needs: [tag]
        runs-on: ubuntu-latest
        concurrency: publish
        steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - name: Get latest tag
              id: get_latest_tag
              uses: actions-ecosystem/action-get-latest-tag@v1
            # - name: Publish
            #   env:
            #     GOPROXY: proxy.golang.org
            #   run: go list -m github.com/sweetrpg/common@${{ steps.get_latest_tag.outputs.tag }}

    notify:
        needs: [tag]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - repo: api-core.rs
                    - repo: catalog-api
                    - repo: catalog-data.rs
                    - repo: catalog-data-processor
                    - repo: catalog-objects.rs
                    - repo: catalog-web
                    - repo: client.rs
                    - repo: data-api
                    - repo: data-objects.rs
                    - repo: db.rs
                    - repo: initiative-api
                    - repo: initiative-data.rs
                    - repo: initiative-objects.rs
                    - repo: initiative-web
                    - repo: kv-api
                    - repo: kv-data.rs
                    - repo: kv-expression-processor
                    - repo: kv-key-processor
                    - repo: kv-objects.rs
                    - repo: kv-value-calculator
                    - repo: kv-web
                    - repo: library-api
                    - repo: library-data.rs
                    - repo: library-objects.rs
                    - repo: library-web
                    - repo: main-web
                    - repo: model-core.rs
                    - repo: shared-web
                    - repo: web-core.rs
        steps:
            - uses: juztcode/repo-ditpatch-action@v1
              continue-on-error: true
              with:
                event-type: db-published
                token: ${{ secrets.REPO_ACCESS_TOKEN }}
                repository: sweetrpg/${{ matrix.repo }}
